name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be plain x.y.z SemVer without a v prefix." >&2
            exit 1
          fi
          node -e '
            const manifest = require("./manifest.json");
            const pkg = require("./package.json");
            const tag = process.env.GITHUB_REF_NAME;
            if (manifest.version !== tag || pkg.version !== tag) {
              throw new Error(`tag ${tag}, manifest ${manifest.version}, package ${pkg.version} must match`);
            }
          '
      - name: Install dependencies
        run: npm ci
      - name: Test and build release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run check
      - name: Package release assets
        shell: bash
        run: |
          mkdir release
          cp main.js manifest.json styles.css release/
      - name: Attest release assets
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: release/*
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/main.js \
            release/manifest.json \
            release/styles.css \
            --verify-tag \
            --title "Latest MathJax ${GITHUB_REF_NAME}" \
            --generate-notes
